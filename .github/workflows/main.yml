name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/example/gamemod/model
          mkdir -p app/src/main/java/com/example/gamemod/adapter
          mkdir -p app/src/main/java/com/example/gamemod/engine

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRclass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GameModApp"
          include(":app")
          EOF

          # 3. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.gamemod"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gamemod"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:name=".GameModApplication"
                  android:label="Game Mod Manager"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. GameModApplication.kt
          cat << 'EOF' > app/src/main/java/com/example/gamemod/GameModApplication.kt
          package com.example.gamemod
          import android.app.Application
          class GameModApplication : Application()
          EOF

          # 7. ModModels.kt
          cat << 'EOF' > app/src/main/java/com/example/gamemod/model/ModModels.kt
          package com.example.gamemod.model

          data class ModInfo(
              val id: String,
              val name: String,
              val version: String,
              val description: String,
              val isEnabled: Boolean = false
          )

          sealed class ValidationResult {
              object Success : ValidationResult()
          }

          interface GameAdapter {
              fun validate(): ValidationResult
              fun getAvailableMods(): List<ModInfo>
              fun toggleMod(id: String, enable: Boolean): Boolean
          }
          EOF

          # 8. DemoGameAdapter.kt
          cat << 'EOF' > app/src/main/java/com/example/gamemod/adapter/DemoGameAdapter.kt
          package com.example.gamemod.adapter

          import com.example.gamemod.model.*

          class DemoGameAdapter : GameAdapter {
              private val mods = mutableListOf(
                  ModInfo("1", "HD Textures Pack", "1.2.0", "Replaces standard textures with 4K resolution graphics."),
                  ModInfo("2", "Unlimited Gold", "1.0.0", "Gives 999k starting gold."),
                  ModInfo("3", "Custom UI Overlay", "0.9.5", "Adds enhanced HUD telemetry and FPS counter.")
              )

              override fun validate(): ValidationResult = ValidationResult.Success

              override fun getAvailableMods(): List<ModInfo> = mods.toList()

              override fun toggleMod(id: String, enable: Boolean): Boolean {
                  val idx = mods.indexOfFirst { it.id == id }
                  return if (idx != -1) {
                      mods[idx] = mods[idx].copy(isEnabled = enable)
                      true
                  } else false
              }
          }
          EOF

          # 9. ModEngine.kt
          cat << 'EOF' > app/src/main/java/com/example/gamemod/engine/ModEngine.kt
          package com.example.gamemod.engine

          import com.example.gamemod.model.*

          class ModEngine(private val adapter: GameAdapter) {
              fun getMods(): List<ModInfo> = adapter.getAvailableMods()
              fun toggleMod(id: String, enable: Boolean) = adapter.toggleMod(id, enable)
          }
          EOF

          # 10. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/gamemod/MainActivity.kt
          package com.example.gamemod

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.example.gamemod.adapter.DemoGameAdapter
          import com.example.gamemod.engine.ModEngine
          import com.example.gamemod.model.ModInfo

          class MainActivity : ComponentActivity() {
              private val engine = ModEngine(DemoGameAdapter())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              ModScreen(engine)
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ModScreen(engine: ModEngine) {
              var modList by remember { mutableStateOf(engine.getMods()) }

              Scaffold(
                  topBar = { TopAppBar(title = { Text("Game Mod Manager") }) }
              ) { padding ->
                  LazyColumn(
                      modifier = Modifier
                          .padding(padding)
                          .padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      items(modList, key = { it.id }) { mod ->
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Row(
                                  modifier = Modifier
                                      .padding(16.dp)
                                      .fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(text = mod.name, style = MaterialTheme.typography.titleMedium)
                                      Text(text = "v${mod.version}", style = MaterialTheme.typography.bodySmall)
                                      Text(text = mod.description, style = MaterialTheme.typography.bodyMedium)
                                  }
                                  Switch(
                                      checked = mod.isEnabled,
                                      onCheckedChange = { enabled ->
                                          engine.toggleMod(mod.id, enabled)
                                          modList = engine.getMods()
                                      }
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Matching Gradle 8.5 & Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  
