name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Setup and Build Debug APK
        run: |
          # Find where the 'app' directory is located
          APP_DIR=$(find . -maxdepth 4 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: Could not find 'app' folder."
            exit 1
          fi
          
          ROOT_DIR=$(dirname "$APP_DIR")
          echo "Building inside root: $ROOT_DIR"
          cd "$ROOT_DIR"

          # Create settings.gradle.kts if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "Generating missing settings.gradle.kts..."
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GameModApp"
          include(":app")
          EOF
          fi

          # Create root build.gradle.kts if missing
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "Generating missing root build.gradle.kts..."
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          fi

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
