name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Detect, Restructure, and Build
        run: |
          # 1. Locate AndroidManifest.xml
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" | head -n 1)

          if [ -z "$MANIFEST_FILE" ]; then
            echo "Error: No AndroidManifest.xml found in repository."
            echo "Directory contents:"
            find . -maxdepth 3
            exit 1
          fi

          echo "Found AndroidManifest.xml at: $MANIFEST_FILE"
          MODULE_DIR=$(dirname $(dirname $(dirname "$MANIFEST_FILE")))

          # 2. If files were uploaded directly to root, wrap them in 'app/' directory
          if [ "$MODULE_DIR" = "." ] || [ "$MODULE_DIR" = "./" ]; then
            echo "Files uploaded directly to root. Creating 'app/' wrapper..."
            mkdir -p app
            [ -d "src" ] && mv src app/
            [ -f "build.gradle.kts" ] && mv build.gradle.kts app/ 2>/dev/null || true
            [ -f "build.gradle" ] && mv build.gradle app/ 2>/dev/null || true
            MODULE_DIR="./app"
          fi

          ROOT_DIR=$(dirname "$MODULE_DIR")
          cd "$ROOT_DIR"

          # 3. Generate root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GameModApp"
          include(":app")
          EOF

          # 4. Generate root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 5. Generate app/build.gradle.kts if missing
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "Generating app/build.gradle.kts..."
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.gamemod"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gamemod"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF
          fi

          # 6. Build the APK
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
